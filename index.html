<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

<style>
  :root{
    --bg:#0e1217;--panel:#161d26;--panel2:#1c2530;--line:#2a3744;
    --ink:#e8edf2;--mut:#8aa0b4;--acc:#ff7a18;--good:#36c98d;--warn:#e6b800;--bad:#ff5a5a;
    --mono:'JetBrains Mono',Consolas,monospace;
  }
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;
    background-image:radial-gradient(circle at 15% 0%,#1a2531 0,transparent 45%),radial-gradient(circle at 90% 8%,#241a14 0,transparent 40%);min-height:100vh}
  header{padding:22px 30px 16px;border-bottom:1px solid var(--line)}
  .badge{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--acc);border:1px solid var(--acc);padding:3px 9px;border-radius:2px;margin-bottom:9px}
  h1{font-weight:900;font-size:28px;letter-spacing:-.02em}h1 span{color:var(--acc)}
  .sub{color:var(--mut);font-size:13px;max-width:680px;margin-top:5px}
  main{padding:20px 30px 80px;max-width:1500px;margin:0 auto}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap;margin-top:4px}
  .tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--mut);font-weight:600;font-size:14px;padding:12px 15px;cursor:pointer;margin-bottom:-1px}
  .tab.on{color:var(--ink);font-weight:800;border-bottom-color:var(--acc)}
  .sec{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;margin:26px 0 12px;display:flex;align-items:center;gap:12px}
  .sec::after{content:'';flex:1;height:1px;background:var(--line)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px}
  .drop{border:2px dashed var(--line);border-radius:10px;padding:24px;text-align:center;background:var(--panel);cursor:pointer;transition:.15s}
  .drop:hover{border-color:var(--acc)}
  .fmt{color:var(--good);font-family:var(--mono);font-size:11px;margin-top:7px}
  label.lb{display:block;font-size:10px;letter-spacing:.06em;color:var(--mut);text-transform:uppercase;margin-bottom:3px}
  input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:8px 10px;font-size:13px;font-family:'Archivo'}
  input:focus,select,textarea:focus{outline:none;border-color:var(--acc)}
  button.btn{font-weight:700;font-size:14px;border:none;border-radius:6px;padding:10px 16px;cursor:pointer;background:var(--acc);color:#1a0d00}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  button.sm{font-size:12px;padding:5px 10px;border-radius:5px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{background:var(--panel2);padding:10px 12px;text-align:left;font-size:11px;text-transform:uppercase;color:var(--mut)}
  td{padding:9px 12px;border-top:1px solid var(--line)}
  .mono{font-family:var(--mono)}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .tag{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--mut)}
  .overlay{position:fixed;inset:0;background:rgba(10,14,18,.86);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:100}
  .overlay.on{display:flex}
  .spin{width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .banner{background:var(--panel2);border:1px solid var(--warn);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--warn);margin-bottom:14px}
  .hidden{display:none}
  .grid4{display:grid;grid-template-columns:1.3fr 1fr .9fr 1.3fr;gap:10}
  @media(max-width:700px){.grid4{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <span class="badge">NOVAFORM · ANBUDSEVALUERING</span>
  <h1>Tilbuds<span>evaluering</span> <span style="font-size:13px;color:var(--mut);font-weight:400">· nettbasert</span></h1>
  <p class="sub">Nettbasert versjon med lagring i Supabase. AI-funksjonene bruker din egen Anthropic-nøkkel. Alt lagres per prosjekt og kan åpnes igjen senere.</p>
</header>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</main>
<div class="overlay" id="overlay"><div class="spin"></div><div class="mono" id="busy" style="font-size:13px"></div></div>

<script type="module">
// ---------- konfig / state ----------
const cfg = {
  supaUrl: localStorage.getItem("supaUrl")||"",
  supaKey: localStorage.getItem("supaKey")||"",
  aiKey:   localStorage.getItem("aiKey")||"",
};
let supa = null;
function initSupa(){ if(cfg.supaUrl && cfg.supaKey && window.supabase){ supa = window.supabase.createClient(cfg.supaUrl, cfg.supaKey);} }
initSupa();

const AIMODEL = "claude-sonnet-4-20250514";
const CRITERIA = [
  {key:"pris",label:"Pris"},{key:"oppdrag",label:"Oppdragsforståelse"},
  {key:"kompetanse",label:"Kompetanse / CV"},{key:"fremdrift",label:"Fremdrift / tid"},
  {key:"forbehold",label:"Forbehold / avvik"},
];

let state = {
  prosjektId:null, prosjektNavn:"",
  spec:"", offers:[], vedlegg:[], brev:[],
  weights:{pris:30,oppdrag:30,kompetanse:20,fremdrift:10,forbehold:10},
  postMatrix:null, forbeholdMatrix:null, innstilling:null, oppdragOrder:null,
};
let tab = cfg.supaUrl ? "evaluering" : "oppsett";

pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

// ---------- hjelpere ----------
const $=id=>document.getElementById(id);
const busy=(t)=>{ $("busy").textContent=t||""; $("overlay").classList.toggle("on",!!t); };
const num=s=>{const v=parseFloat(String(s).replace(/\s|kr|nok/gi,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",",".").replace(/[^\d.\-]/g,""));return isNaN(v)?0:Math.round(v);};
const fmt=n=>Number(n||0).toLocaleString("nb-NO")+" kr";
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tilEks=(p,mva)=>{const x=Number(p)||0;return mva==="inkl"?Math.round(x/1.25):x;};

function parseLoose(raw){
  if(!raw) throw new Error("tomt svar");
  let s=raw.replace(/```json|```/gi,"").trim();
  const i=s.indexOf("{"); if(i>0)s=s.slice(i);
  try{return JSON.parse(s);}catch(_){}
  let inStr=false,esc2=false,depth=0,lastComma=-1;
  for(let k=0;k<s.length;k++){const c=s[k];if(esc2){esc2=false;continue;}if(c==="\\"){esc2=true;continue;}if(c==='"'){inStr=!inStr;continue;}if(inStr)continue;if(c==="{"||c==="[")depth++;else if(c==="}"||c==="]")depth--;else if(c===","&&depth<=2)lastComma=k;}
  let fixed=s;
  if(inStr&&lastComma>0)fixed=s.slice(0,lastComma);else if(inStr)fixed+='"';
  inStr=false;esc2=false;const st=[];
  for(let k=0;k<fixed.length;k++){const c=fixed[k];if(esc2){esc2=false;continue;}if(c==="\\"){esc2=true;continue;}if(c==='"'){inStr=!inStr;continue;}if(inStr)continue;if(c==="{")st.push("}");else if(c==="[")st.push("]");else if(c==="}"||c==="]")st.pop();}
  if(inStr)fixed+='"';while(st.length)fixed+=st.pop();
  fixed=fixed.replace(/,\s*([}\]])/g,"$1");
  return JSON.parse(fixed);
}

// ---------- AI-kall (egen nøkkel, direkte fra nettleser) ----------
async function ai(content, maxTokens=1000, system=null){
  if(!cfg.aiKey) throw new Error("Mangler Anthropic API-nøkkel (sett den i Oppsett).");
  const body={model:AIMODEL,max_tokens:maxTokens,messages:[{role:"user",content}]};
  if(system) body.system=system;
  const resp=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key":cfg.aiKey,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body:JSON.stringify(body)
  });
  if(!resp.ok){ const t=await resp.text(); throw new Error("AI-feil "+resp.status+": "+t.slice(0,200)); }
  const data=await resp.json();
  return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim();
}

// ---------- filinnlesing ----------
async function readFile(f){
  const ext=f.name.split(".").pop().toLowerCase();
  if(ext==="pdf"){
    const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
    let t="";for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();t+=c.items.map(x=>x.str).join(" ")+"\n";}
    let images=null;
    if(t.replace(/\s/g,"").length<40){
      images=[];const maxS=Math.min(pdf.numPages,8);
      for(let i=1;i<=maxS;i++){const pg=await pdf.getPage(i);const vp=pg.getViewport({scale:2.0});const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;images.push(cv.toDataURL("image/jpeg",0.7).split(",")[1]);}
    }
    return {text:t,type:"PDF",images};
  }
  if(ext==="docx"){const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});return {text:r.value,type:"DOCX"};}
  if(["xlsx","xls","csv"].includes(ext)){
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});let t="";const rows=[];
    wb.SheetNames.forEach(n=>{t+="["+n+"]\n"+XLSX.utils.sheet_to_csv(wb.Sheets[n])+"\n";XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:""}).forEach(r=>rows.push(r));});
    return {text:t,type:ext.toUpperCase(),rows};
  }
  return {text:await f.text(),type:"TXT"};
}
function postsFromRows(rows){
  if(!rows||!rows.length)return[];
  const kw={postnr:/^(post(nr)?|nr|kode|ns\s?3451)$/i,epris:/enhetspris|enh\.?\s?pris|pris\s?pr|à-?pris|a-pris/i,sum:/^(sum|beløp|belop|total(sum)?|linjesum|postsum)$/i,mengde:/mengde|antall|kvant/i,enhet:/^(enhet|enh\.?|måleenhet)$/i,beskr:/beskriv|tekst|ytelse|arbeid|betegnelse/i};
  let hIdx=-1,hMap=null,best=1;
  for(let i=0;i<Math.min(rows.length,25);i++){const cells=rows[i].map(c=>String(c).trim().toLowerCase());const map={};const used=new Set();let hits=0;["postnr","epris","sum","mengde","enhet","beskr"].forEach(k=>{const ci=cells.findIndex((c,idx)=>!used.has(idx)&&kw[k].test(c));if(ci>=0){map[k]=ci;used.add(ci);hits++;}});if(hits>best){best=hits;hIdx=i;hMap=map;}}
  if(hIdx<0||!hMap||(hMap.beskr==null&&hMap.postnr==null))return[];
  const out=[];
  for(let i=hIdx+1;i<rows.length;i++){const r=rows[i];if(!r||r.every(c=>String(c).trim()===""))continue;
    const beskr=hMap.beskr!=null?String(r[hMap.beskr]||"").trim():"";const postnr=hMap.postnr!=null?String(r[hMap.postnr]||"").trim():"";
    const sum=hMap.sum!=null?num(r[hMap.sum]):null;const epris=hMap.epris!=null?num(r[hMap.epris]):null;const mengde=hMap.mengde!=null?num(r[hMap.mengde]):null;const enhet=hMap.enhet!=null?String(r[hMap.enhet]||"").trim():"";
    if(!beskr&&!postnr)continue;if(!beskr&&!sum&&!epris)continue;
    out.push({postnr,beskrivelse:beskr,mengde,enhet,enhetspris:epris,sum});}
  return out;
}
function guessCompany(t,fn){const m=t.match(/\b([A-ZÆØÅ][\wæøåA-ZÆØÅ&\- ]{2,40}?\s(?:AS|ASA|ANS|DA))\b/);return m?m[1].trim():fn.replace(/\.[^.]+$/,"");}
function guessPrice(t){
  const norm=(t||"").replace(/\u00a0/g," ");
  const re=/(?:tilbudssum|kontraktssum|totalsum|sum|total|pris)([^\d]{0,40})([\d \.]{4,}(?:,\d{2})?)([^\n]{0,25})/gi;
  let m,c=[];while((m=re.exec(norm))){const v=num(m[2]);if(!v)continue;const a=(m[1]+" "+m[3]).toLowerCase();let mva="ukjent";if(/inkl|inklusiv|m\.?\s?mva|med\s?mva/.test(a))mva="inkl";else if(/eks|ekskl|u\.?\s?mva|uten\s?mva|netto/.test(a))mva="eks";c.push({v,mva});}
  if(c.length){const eks=c.filter(x=>x.mva==="eks");if(eks.length)return{price:Math.max(...eks.map(x=>x.v)),mva:"eks"};const b=c.reduce((a,b)=>b.v>a.v?b:a);return{price:b.v,mva:b.mva};}
  return {price:0,mva:"ukjent"};
}

// ---------- render-rammeverk ----------
const TABS=[["oppsett","Oppsett"],["evaluering","Evaluering"],["brev","Tilbudsbrev"],["vedlegg","Vedlegg / CV"],["forbehold","Forbehold"],["innstilling","Innstilling"]];
function renderTabs(){
  $("tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab ${tab===k?"on":""}" data-tab="${k}">${l}${k==="evaluering"&&state.offers.length?` (${state.offers.length})`:""}</button>`).join("");
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});
}
function render(){ renderTabs(); const v=$("view"); v.innerHTML="";
  if(tab==="oppsett") return renderOppsett(v);
  if(!cfg.supaUrl){ v.innerHTML=`<div class="banner">Sett opp Supabase og API-nøkkel i Oppsett-fanen først.</div>`; return; }
  if(tab==="evaluering") return renderEvaluering(v);
  if(tab==="brev") return renderBrev(v);
  if(tab==="vedlegg") return renderVedlegg(v);
  if(tab==="forbehold") return renderForbehold(v);
  if(tab==="innstilling") return renderInnstilling(v);
}

// ---------- OPPSETT ----------
function renderOppsett(v){
  v.innerHTML=`
  <div class="sec">Oppsett – nøkler og lagring</div>
  <div class="card" style="max-width:640px">
    <p style="color:var(--mut);font-size:13px;margin-bottom:14px">Nøklene lagres kun lokalt i din nettleser (localStorage), aldri i koden. Se OPPSETT.md for hvordan du får tak i dem.</p>
    <div style="display:grid;gap:12px">
      <div><label class="lb">Supabase Project URL</label><input id="i_url" value="${esc(cfg.supaUrl)}" placeholder="https://xxxx.supabase.co"></div>
      <div><label class="lb">Supabase anon key</label><input id="i_key" value="${esc(cfg.supaKey)}" placeholder="eyJhbGciOi..."></div>
      <div><label class="lb">Anthropic API-nøkkel</label><input id="i_ai" value="${esc(cfg.aiKey)}" placeholder="sk-ant-..."></div>
      <div class="row">
        <button class="btn" id="save_cfg">Lagre oppsett</button>
        <button class="btn ghost" id="test_cfg">Test tilkobling</button>
        <span id="cfg_msg" style="font-size:13px"></span>
      </div>
    </div>
  </div>
  <div class="sec">Prosjekter</div>
  <div class="card" style="max-width:640px">
    <div class="row" style="margin-bottom:12px">
      <input id="p_navn" placeholder="Nytt prosjektnavn (f.eks. Døves Kultursenter)" style="flex:1;min-width:200px">
      <button class="btn" id="p_ny">Nytt prosjekt</button>
    </div>
    <div id="p_liste" style="color:var(--mut);font-size:13px">Laster…</div>
  </div>`;
  $("save_cfg").onclick=()=>{cfg.supaUrl=$("i_url").value.trim();cfg.supaKey=$("i_key").value.trim();cfg.aiKey=$("i_ai").value.trim();localStorage.setItem("supaUrl",cfg.supaUrl);localStorage.setItem("supaKey",cfg.supaKey);localStorage.setItem("aiKey",cfg.aiKey);initSupa();$("cfg_msg").innerHTML='<span style="color:var(--good)">Lagret ✓</span>';listeProsjekter();};
  $("test_cfg").onclick=async()=>{try{initSupa();if(!supa)throw new Error("Mangler URL/nøkkel");const {error}=await supa.from("prosjekter").select("id").limit(1);if(error)throw error;$("cfg_msg").innerHTML='<span style="color:var(--good)">Tilkobling OK ✓</span>';}catch(e){$("cfg_msg").innerHTML='<span style="color:var(--bad)">Feil: '+esc(e.message||e)+'</span>';}};
  $("p_ny").onclick=async()=>{const navn=$("p_navn").value.trim();if(!navn)return alert("Skriv et navn");state={...state,prosjektId:null,prosjektNavn:navn,spec:"",offers:[],vedlegg:[],brev:[],postMatrix:null,forbeholdMatrix:null,innstilling:null,oppdragOrder:null};await lagre();tab="evaluering";render();};
  listeProsjekter();
}
async function listeProsjekter(){
  if(!supa){$("p_liste") && ($("p_liste").innerHTML="Sett opp Supabase først.");return;}
  try{const {data,error}=await supa.from("prosjekter").select("id,navn,oppdatert").order("oppdatert",{ascending:false});if(error)throw error;
    if(!$("p_liste"))return;
    $("p_liste").innerHTML = data.length ? data.map(p=>`<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding:8px 0">
      <span><b>${esc(p.navn)}</b> <span class="tag">${new Date(p.oppdatert).toLocaleString("nb-NO")}</span></span>
      <span class="row"><button class="btn sm" data-open="${p.id}">Åpne</button><button class="btn ghost sm" data-del="${p.id}">Slett</button></span></div>`).join("") : "Ingen prosjekter ennå.";
    document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>åpneProsjekt(b.dataset.open));
    document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("Slette prosjektet?")){await supa.from("prosjekter").delete().eq("id",b.dataset.del);listeProsjekter();}});
  }catch(e){$("p_liste").innerHTML='<span style="color:var(--bad)">Feil: '+esc(e.message||e)+'</span>';}
}
async function åpneProsjekt(id){
  busy("Åpner prosjekt…");
  try{const {data,error}=await supa.from("prosjekter").select("*").eq("id",id).single();if(error)throw error;
    state={...state,...data.data,prosjektId:data.id,prosjektNavn:data.navn};tab="evaluering";}
  catch(e){alert("Kunne ikke åpne: "+(e.message||e));}
  busy("");render();
}
async function lagre(){
  if(!supa)return alert("Sett opp Supabase først.");
  busy("Lagrer prosjekt…");
  try{
    const payload={navn:state.prosjektNavn||"Uten navn",data:pakkState(),oppdatert:new Date().toISOString()};
    if(state.prosjektId){const {error}=await supa.from("prosjekter").update(payload).eq("id",state.prosjektId);if(error)throw error;}
    else{const {data,error}=await supa.from("prosjekter").insert(payload).select().single();if(error)throw error;state.prosjektId=data.id;}
  }catch(e){alert("Lagring feilet: "+(e.message||e));}
  busy("");
}
// pakk state for lagring (dropp store bildedata og File-objekter for å holde raden liten)
function pakkState(){
  const strip=o=>({...o,file:undefined,images:o.images?`(${o.images.length} sidebilder – lastes ikke)`:null});
  return {spec:state.spec,weights:state.weights,oppdragOrder:state.oppdragOrder,
    offers:state.offers.map(strip),vedlegg:state.vedlegg.map(v=>({...v,file:undefined})),
    brev:state.brev.map(b=>({...b,file:undefined})),
    postMatrix:state.postMatrix,forbeholdMatrix:state.forbeholdMatrix,innstilling:state.innstilling};
}

// ---------- EVALUERING-fane ----------
function renderEvaluering(v){
  v.innerHTML=`
  <div class="row" style="justify-content:space-between;margin-bottom:8px">
    <div><b>${esc(state.prosjektNavn||"(uten prosjekt)")}</b> <span class="tag">${state.prosjektId?"lagret":"ulagret"}</span></div>
    <div class="row"><button class="btn sm" id="e_lagre">Lagre prosjekt</button></div>
  </div>
  <div class="sec">1 · Funksjonsbeskrivelse (grunnlag)</div>
  <div class="card">
    <textarea id="e_spec" style="min-height:110px;font-family:var(--mono);font-size:12px" placeholder="Lim inn funksjonsbeskrivelsen, eller last opp fil…">${esc(state.spec)}</textarea>
    <div class="row" style="margin-top:10px"><input type="file" id="e_specfile" accept=".pdf,.docx,.txt" style="max-width:280px"></div>
  </div>
  <div class="sec">2 · Tilbud (${state.offers.length}/10)</div>
  <div class="drop" id="e_drop"><div style="font-weight:800">Slipp tilbudsfiler her, eller klikk</div><div class="fmt">PDF · DOCX · XLSX · XLS · CSV · TXT</div></div>
  <input type="file" id="e_files" multiple accept=".pdf,.docx,.xlsx,.xls,.csv,.txt" class="hidden">
  <div id="e_offers" style="display:grid;gap:10px;margin-top:14px"></div>
  <div class="sec">3 · Vekting</div>
  <div class="card"><div class="row" id="e_weights"></div></div>
  <div class="row" style="margin-top:16px">

  $("e_weights").innerHTML=CRITERIA.map(c=>`<div><label class="lb">${c.label}</label><input type="number" min="0" max="100" style="width:80px" value="${state.weights[c.key]}" data-w="${c.key}"></div>`).join("")+`<div style="align-self:end" class="mono" id="wsum"></div>`;

      state.offers.push({id:Date.now()+"_"+Math.random().toString(36).slice(2,7),name:f.name,type,text,images:images||null,file:f,company:guessCompany(text,f.name),price:pg.price,mva:pg.mva,scores:{},ai:null,note:"",excelPoster:ep,posterKilde:ep.length?"excel":null});
    }catch(e){alert("Feil ved "+f.name+": "+e.message);}}
  busy("");render();
}
async function reReadOffer(id){const o=state.offers.find(x=>x.id==id);if(!o||!o.file)return alert("Last opp filen igjen for å lese på nytt.");busy("Leser "+o.name+" på nytt…");try{const {text,type,rows,images}=await readFile(o.file);const pg=guessPrice(text);const ep=postsFromRows(rows);Object.assign(o,{text,type,images:images||null,price:pg.price||o.price,mva:pg.mva,excelPoster:ep,posterKilde:ep.length?"excel":null,scores:{},ai:null,poster:[]});}catch(e){alert(e.message);}busy("");render();}
async function lesTallFraBilde(id){const o=state.offers.find(x=>x.id==id);if(!o||!o.images)return;busy("Leser totalsum fra bilde…");let funnet=null;try{for(let i=0;i<o.images.length&&!funnet;i++){const pp="Bildet viser en side fra en byggkalkyle/tilbud. Finn den totale tilbudssummen (Sum/Sum Fag/Selvkost/Totalsum/Tilbudssum, normalt eks. mva). Svar KUN JSON: {\"tilbudssum\":<heltall eller null>,\"mva\":\"eks\"|\"inkl\"|\"ukjent\"}";const txt=await ai([{type:"text",text:pp},{type:"image",source:{type:"base64",media_type:"image/jpeg",data:o.images[i]}}]);if(txt){const j=parseLoose(txt);if(Number(j.tilbudssum)>0)funnet={sum:Math.round(Number(j.tilbudssum)),mva:j.mva||"eks"};}}}catch(e){alert("Kunne ikke lese: "+e.message);}busy("");if(funnet){o.price=funnet.sum;o.mva=funnet.mva==="ukjent"?"eks":funnet.mva;}else alert("Fant ikke summen. Skriv den inn manuelt.");render();}

async function evaluate(){
  if(!state.spec.trim())return alert("Legg inn funksjonsbeskrivelsen først.");
  if(!state.offers.length)return alert("Last opp minst ett tilbud.");
  for(let idx=0;idx<state.offers.length;idx++){const o=state.offers[idx];
    busy(`AI vurderer ${o.company||o.name} (${idx+1}/${state.offers.length})…`);
    try{
      const bygg=(sN,tN)=>`Du er en erfaren rådgiver i bygg/anlegg som evaluerer et tilbud mot en funksjonsbeskrivelse.

=== FUNKSJONSBESKRIVELSE ===
${state.spec.slice(0,sN)}

=== TILBUD FRA "${o.company||o.name}" ===
${o.images&&o.images.length?"(Bilde-PDF uten tekstlag – les tabell/tall fra bildene.)":o.text.slice(0,tN)}
${(()=>{const vv=state.vedlegg.filter(x=>x.koblet===(o.company||o.name));return vv.length?"\n=== VEDLEGG (CV) ===\n"+vv.map(x=>`[${x.name}]\n${(x.text||"").slice(0,1500)}`).join("\n\n"):"";})()}

Vurder 0-100 for hvert kriterium og begrunn konkret:
- oppdrag: dekning av funksjonsbeskrivelsen
- kompetanse: CV, referanser, kapasitet
- fremdrift: realistisk/tydelig fremdrift
- forbehold: færre/mindre tyngende gir høyere score

Svar KUN med gyldig JSON, konsist:
{"oppdrag":<0-100>,"kompetanse":<0-100>,"fremdrift":<0-100>,"forbehold":<0-100>,"tilbudssum":<eks.mva tall eller null>,"begrunnelse":"<3-4 setninger>","sammendrag":"<1-2 setn>","styrker":["..",".."],"svakheter":["..",".."],"avvik":[".."]}`;
      const specLen=state.spec.length, tekstLen=(o.images&&o.images.length)?0:(o.text||"").length, TOTAL=11000;
      let sB,tB; if(specLen+tekstLen<=TOTAL){sB=specLen;tB=tekstLen;}else{tB=Math.min(tekstLen,Math.max(Math.round(TOTAL*0.55),TOTAL-specLen));sB=Math.min(specLen,TOTAL-tB);}
      const budsjetter=[[sB,tB],[3000,3000],[1500,1500]]; let j=null,feil="";
      for(const [s2,t2] of budsjetter){try{const innhold=[{type:"text",text:bygg(s2,t2)}];if(o.images&&o.images.length)o.images.forEach(b=>innhold.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:b}}));const txt=await ai(innhold,1000);if(!txt){feil="tomt svar";continue;}j=parseLoose(txt);if(j&&(j.oppdrag!=null||j.sammendrag))break;}catch(e){feil=e.message;}}
      if(!j)throw new Error(feil||"tomt svar");
      o.scores={oppdrag:j.oppdrag,kompetanse:j.kompetanse,fremdrift:j.fremdrift,forbehold:j.forbehold};
      o.ai={sammendrag:j.sammendrag||"",begrunnelse:j.begrunnelse||"",styrker:j.styrker||[],svakheter:j.svakheter||[],avvik:j.avvik||[]};
      if(!o.price&&Number(j.tilbudssum)>0){o.price=Math.round(Number(j.tilbudssum));if(o.mva==="ukjent")o.mva="eks";}
      o.poster=(o.excelPoster&&o.excelPoster.length)?o.excelPoster:[];o.posterKilde=o.excelPoster&&o.excelPoster.length?"excel":null;
    }catch(e){o.ai={sammendrag:"Kunne ikke fullføre: "+e.message,styrker:[],svakheter:[],avvik:[]};}
    if((!o.poster||!o.poster.length)&&o.images&&o.images.length){const alle=[];for(let ci=0;ci<o.images.length;ci++){busy(`Leser poster fra bilde (${ci+1}/${o.images.length}) – ${o.company||o.name}…`);try{const pp=`Bildet viser side ${ci+1} av en byggkalkyle (NS 3451). Hent ALLE prisposter du ser: postnr, ns3451, beskrivelse, mengde, enhet, enhetspris, sum. Tom kolonne = null. Svar KUN JSON: {"poster":[{"postnr":"","ns3451":"","beskrivelse":"","mengde":null,"enhet":"","enhetspris":null,"sum":null}]}`;const txt=await ai([{type:"text",text:pp},{type:"image",source:{type:"base64",media_type:"image/jpeg",data:o.images[ci]}}],1000);const j=parseLoose(txt);if(Array.isArray(j.poster))alle.push(...j.poster.filter(p=>p&&(p.beskrivelse||p.sum!=null||p.enhetspris!=null||p.mengde!=null)));}catch(e){}}if(alle.length){o.poster=alle;o.posterKilde="ai-bilde";}}
  }
  await matchPoster(); busy(""); await lagre(); render();
}

async function matchPoster(){
  const wp=state.offers.filter(o=>o.poster&&o.poster.length);
  if(!wp.length){state.postMatrix=null;return;}
  busy("AI matcher poster (NS 3451)…");
  try{
    const payload=wp.map(o=>({tilbyder:o.company||o.name,poster:(o.poster||[]).map(p=>({postnr:p.postnr,ns3451:p.ns3451||"",beskrivelse:p.beskrivelse,mengde:p.mengde,enhet:p.enhet,enhetspris:p.enhetspris,sum:p.sum}))}));
    const prompt=`Grupper prisposter fra flere byggtilbud og normaliser mot NS 3451 bygningsdelstabellen slik at like arbeider sammenlignes selv om tilbyderne nummererer ulikt. Begrunn grundig.

DATA:
${JSON.stringify(payload).slice(0,30000)}

Svar KUN med gyldig JSON, konsist:
{"grupper":[{"ns3451":"<nr>","bygningsdel":"<navn>","beskrivelse":"","enhet":"","priser":{"<tilbyder>":<sum eller null>},"kommentar":"<begrunnet>","konklusjon":"<begrunnet>"}]}
Sorter etter NS 3451-nummer.`;
    const full=wp.map(o=>({tilbyder:o.company||o.name,kilde:o.posterKilde||"ai",poster:o.poster||[]}));
    const txt=await ai(prompt,1000);
    if(!txt){state.postMatrix={grupper:[],tilbydere:wp.map(o=>o.company||o.name),full};}
    else{const j=parseLoose(txt);state.postMatrix={grupper:j.grupper||[],tilbydere:wp.map(o=>o.company||o.name),full};}
  }catch(e){state.postMatrix={grupper:[],tilbydere:wp.map(o=>o.company||o.name),full:wp.map(o=>({tilbyder:o.company||o.name,kilde:o.posterKilde||"ai",poster:o.poster||[]})),note:"Matching feilet: "+e.message};}
  busy("");
}

function totals(){
  const prices=state.offers.map(o=>tilEks(o.price,o.mva)).filter(p=>p>0);
  const minP=prices.length?Math.min(...prices):0;
  const wsum=Object.values(state.weights).reduce((a,b)=>a+Number(b),0)||1;
  return state.offers.map(o=>{const eks=tilEks(o.price,o.mva);const priceScore=(eks>0&&minP)?Math.round(minP/eks*100):0;const s={pris:priceScore,...o.scores};let tot=0;CRITERIA.forEach(c=>tot+=(Number(s[c.key])||0)*(Number(state.weights[c.key])||0));return {...o,priceEks:eks,s,total:Math.round(tot/wsum)};}).sort((a,b)=>b.total-a.total);
}
function oppdragRanked(){const sc=state.offers.filter(o=>o.scores&&o.scores.oppdrag!=null);if(state.oppdragOrder){const m=Object.fromEntries(sc.map(o=>[o.id,o]));const ord=state.oppdragOrder.map(id=>m[id]).filter(Boolean);sc.forEach(o=>{if(!state.oppdragOrder.includes(o.id))ord.push(o);});return ord;}return [...sc].sort((a,b)=>(b.scores.oppdrag||0)-(a.scores.oppdrag||0));}

function moveOpp(id,dir){const cur=oppdragRanked().map(o=>o.id);const i=cur.indexOf(id),j=i+dir;if(i<0||j<0||j>=cur.length)return;[cur[i],cur[j]]=[cur[j],cur[i]];state.oppdragOrder=cur;renderResult();}

function pmTilbydere(){if(state.postMatrix?.tilbydere?.length)return state.postMatrix.tilbydere;return state.offers.map(o=>o.company||o.name);}

    grupper.map((g,gi)=>{const vals=tb.map(t=>Number(g.priser?.[t])||0).filter(v=>v>0);const min=vals.length?Math.min(...vals):0;

  return h;
}
function bindPostMatrix(){
  if($("pm_add"))$("pm_add").onclick=()=>{const tb=pmTilbydere();const ny={ns3451:"",beskrivelse:"",enhet:"",priser:{},kommentar:"",konklusjon:"",manuell:true};const base=(state.postMatrix&&!state.postMatrix.error)?state.postMatrix:{grupper:[],tilbydere:tb,full:[]};state.postMatrix={...base,tilbydere:base.tilbydere?.length?base.tilbydere:tb,grupper:[...(base.grupper||[]),ny]};renderResult();};
  document.querySelectorAll("[data-pg]").forEach(el=>el.oninput=()=>{const g=state.postMatrix.grupper[+el.dataset.pg];g[el.dataset.pf]=el.value;});
  document.querySelectorAll("[data-pp]").forEach(el=>el.oninput=()=>{const g=state.postMatrix.grupper[+el.dataset.pp];g.priser={...(g.priser||{})};g.priser[el.dataset.pt]=el.value===""?null:(num(el.value)||null);});
  document.querySelectorAll("[data-pdel]").forEach(b=>b.onclick=()=>{state.postMatrix.grupper=state.postMatrix.grupper.filter((_,i)=>i!=b.dataset.pdel);renderResult();});
}

function renderBrev(v){
  v.innerHTML=`<div class="sec">Tilbudsbrev / forbeholdslister</div>
  <p style="color:var(--mut);font-size:13px;margin-bottom:12px">Last opp tilbudsbrev og egne forbeholdsdokumenter. Brukes i forbeholdsanalysen.</p>
  <div class="drop" id="b_drop"><div style="font-weight:800">Slipp tilbudsbrev her, eller klikk</div><div class="fmt">PDF · DOCX · TXT</div></div>
  <input type="file" id="b_files" multiple accept=".pdf,.docx,.txt" class="hidden">
  <div id="b_list" style="display:grid;gap:12px;margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))"></div>
  <div style="margin-top:16px"><button class="btn" id="b_analyse">Analyser forbehold →</button></div>`;
  $("b_drop").onclick=()=>$("b_files").click();$("b_drop").ondragover=e=>e.preventDefault();$("b_drop").ondrop=e=>{e.preventDefault();addBrev(e.dataTransfer.files);};$("b_files").onchange=e=>addBrev(e.target.files);
  $("b_analyse").onclick=async()=>{await analyseForbehold();tab="forbehold";render();};
  renderBrevList();
}
function renderBrevList(){const c=$("b_list");if(!c)return;c.innerHTML=state.brev.map(b=>`<div class="card"><div class="row" style="justify-content:space-between"><input value="${esc(b.company)}" data-bf="${b.id}" style="font-weight:700"><button class="btn ghost sm" data-bdel="${b.id}">✕</button></div><div style="max-height:220px;overflow:auto;font-size:12px;color:var(--mut);white-space:pre-wrap;margin-top:8px">${esc((b.text||"").slice(0,2000))}</div></div>`).join("");c.querySelectorAll("[data-bf]").forEach(i=>i.oninput=()=>{const b=state.brev.find(x=>x.id==i.dataset.bf);b.company=i.value;});c.querySelectorAll("[data-bdel]").forEach(b=>b.onclick=()=>{state.brev=state.brev.filter(x=>x.id!=b.dataset.bdel);renderBrevList();});}
async function addBrev(list){for(const f of [...list]){busy("Leser "+f.name+"…");try{const {text,type}=await readFile(f);state.brev.push({id:Date.now()+"_"+Math.random().toString(36).slice(2,7),name:f.name,type,text,company:guessCompany(text,f.name)});}catch(e){alert(e.message);}}busy("");renderBrevList();}

async function analyseForbehold(){
  const kilder=[...state.brev.map(b=>({t:b.company||b.name,k:"tilbudsbrev",x:b.text})),...state.offers.map(o=>({t:o.company||o.name,k:"tilbud",x:o.text}))].filter(k=>k.x&&k.x.trim());
  if(!kilder.length)return alert("Last opp tilbudsbrev eller tilbud først.");
  const per={};kilder.forEach(k=>{(per[k.t]||=[]).push(k);});
  busy("AI analyserer forbehold…");
  try{const navn=Object.keys(per);const cap=Math.max(2000,Math.floor(40000/navn.length));
    const payload=navn.map(n=>({tilbyder:n,tekst:per[n].map(k=>`[${k.k}] ${k.x}`).join("\n\n").slice(0,cap)}));
    const prompt=`Finn ALLE forbehold, avvik og betingelser hver tilbyder har tatt. Grupper per tema slik at de kan sammenlignes.

DATA:
${JSON.stringify(payload).slice(0,40000)}

Svar KUN med gyldig JSON, konsist (maks 12 temaer, korte tekster):
{"tilbydere":["<navn>"],"forbehold":[{"tema":"","perTilbyder":{"<navn>":"<kort, eller 'Ingen'>"},"vurdering":"<kort>"}],"oppsummering":"<1-2 setn>"}`;
    const txt=await ai(prompt,1000);const j=parseLoose(txt);
    state.forbeholdMatrix={tilbydere:j.tilbydere?.length?j.tilbydere:navn,forbehold:j.forbehold||[],oppsummering:j.oppsummering||""};
  }catch(e){state.forbeholdMatrix={error:e.message};}
  busy("");await lagre();
}
function renderForbehold(v){
  v.innerHTML=`<div class="sec">Forbeholdssammenligning</div><button class="btn" id="f_run">Kjør / oppdater forbeholdsanalyse</button><div id="f_res" style="margin-top:16px"></div>`;
  $("f_run").onclick=async()=>{await analyseForbehold();render();};
  const fm=state.forbeholdMatrix,el=$("f_res");
  if(!fm){el.innerHTML='<div style="color:var(--mut)">Ikke kjørt ennå.</div>';return;}
  if(fm.error){el.innerHTML='<div style="color:var(--warn)">Feil: '+esc(fm.error)+'</div>';return;}
  let h="";if(fm.oppsummering)h+=`<div class="card" style="border-color:var(--good);margin-bottom:14px"><span class="mono" style="color:var(--good);font-size:10px">OPPSUMMERING </span>${esc(fm.oppsummering)}</div>`;
  if(fm.forbehold?.length){h+=`<div style="overflow-x:auto;border:1px solid var(--line);border-radius:10px"><table><thead><tr><th style="min-width:150px">Tema</th>${fm.tilbydere.map(t=>`<th style="min-width:160px">${esc(t)}</th>`).join("")}<th style="min-width:200px">Vurdering</th></tr></thead><tbody>`+
    fm.forbehold.map(f=>`<tr><td style="font-weight:700">${esc(f.tema)}</td>${fm.tilbydere.map(t=>{const val=f.perTilbyder?.[t]||"–";const ingen=/^ingen$/i.test(String(val).trim());return `<td style="color:${ingen?"var(--good)":"var(--ink)"}">${ingen?"Ingen":esc(val)}</td>`;}).join("")}<td style="color:var(--mut)">${esc(f.vurdering||"–")}</td></tr>`).join("")+`</tbody></table></div>`;}
  else h+='<div style="color:var(--mut)">Ingen forbehold funnet.</div>';
  el.innerHTML=h;
}

function renderVedlegg(v){
  v.innerHTML=`<div class="sec">Vedlegg / CV</div>
  <p style="color:var(--mut);font-size:13px;margin-bottom:12px">Last opp CV/kompetansedokumenter. AI kobler til riktig entreprenør. Last opp tilbudene i Evaluering-fanen først.</p>
  <div class="drop" id="v_drop"><div style="font-weight:800">Slipp CV/vedlegg her, eller klikk</div><div class="fmt">PDF · DOCX · XLSX · TXT</div></div>
  <input type="file" id="v_files" multiple accept=".pdf,.docx,.xlsx,.xls,.txt" class="hidden">
  <div id="v_list" style="display:grid;gap:10px;margin-top:14px"></div>`;
  $("v_drop").onclick=()=>$("v_files").click();$("v_drop").ondragover=e=>e.preventDefault();$("v_drop").ondrop=e=>{e.preventDefault();addVedlegg(e.dataTransfer.files);};$("v_files").onchange=e=>addVedlegg(e.target.files);
  renderVedleggList();
}
function renderVedleggList(){const c=$("v_list");if(!c)return;c.innerHTML=state.vedlegg.map(v=>`<div class="card row" style="justify-content:space-between"><div style="flex:1;min-width:180px"><b>${esc(v.name)}</b> <span class="tag">${v.type}</span>${v.koblingsbegrunnelse?`<div style="font-size:11.5px;color:var(--mut)">${esc(v.koblingsbegrunnelse)}</div>`:""}</div><div class="row"><label class="lb" style="margin:0">Koblet:</label><select data-vk="${v.id}" style="border-color:${v.koblet?"var(--good)":"var(--warn)"}"><option value="">— ikke koblet —</option>${state.offers.map(o=>`<option value="${esc(o.company||o.name)}"${v.koblet===(o.company||o.name)?" selected":""}>${esc(o.company||o.name)}</option>`).join("")}</select><button class="btn ghost sm" data-vdel="${v.id}">✕</button></div></div>`).join("");c.querySelectorAll("[data-vk]").forEach(s=>s.onchange=()=>{const v=state.vedlegg.find(x=>x.id==s.dataset.vk);v.koblet=s.value||null;});c.querySelectorAll("[data-vdel]").forEach(b=>b.onclick=()=>{state.vedlegg=state.vedlegg.filter(x=>x.id!=b.dataset.vdel);renderVedleggList();});}
async function addVedlegg(list){const nye=[];for(const f of [...list]){busy("Leser "+f.name+"…");try{const {text,type}=await readFile(f);nye.push({id:Date.now()+"_"+Math.random().toString(36).slice(2,7),name:f.name,type,text,koblet:null});}catch(e){alert(e.message);}}
  const kjente=state.offers.map(o=>o.company||o.name).filter(Boolean);
  if(kjente.length){for(const vd of nye){busy("Kobler "+vd.name+"…");try{const p=`Entreprenører:\n${kjente.map((n,i)=>`${i+1}. ${n}`).join("\n")}\n\nHvilken tilhører dette vedlegget? VEDLEGG (${vd.name}):\n${(vd.text||"").slice(0,4000)}\n\nSvar KUN JSON: {"entreprenor":"<eksakt navn eller null>","begrunnelse":"<kort>"}`;const txt=await ai(p,1000);const j=parseLoose(txt);vd.koblet=(j.entreprenor&&kjente.includes(j.entreprenor))?j.entreprenor:null;vd.koblingsbegrunnelse=j.begrunnelse||"";}catch(e){vd.koblet=null;}}}
  state.vedlegg.push(...nye);busy("");renderVedleggList();}

function renderInnstilling(v){
  v.innerHTML=`<div class="sec">Skriftlig innstilling</div>
  <p style="color:var(--mut);font-size:13px;margin-bottom:12px">AI skriver en utfyllende innstilling – samlet og per tilbyder. Kjør evalueringen først.</p>
  <button class="btn" id="in_run">Skriv / oppdater innstilling</button><div id="in_res" style="margin-top:16px"></div>`;
  $("in_run").onclick=lagInnstilling;
  const inn=state.innstilling,el=$("in_res");if(!inn)return;if(inn.error){el.innerHTML='<div style="color:var(--warn)">Feil: '+esc(inn.error)+'</div>';return;}
  el.innerHTML=`<div class="card" style="border-color:var(--good);margin-bottom:16px"><div class="mono" style="color:var(--good);font-size:11px">SAMLET INNSTILLING</div><div style="font-size:14px;line-height:1.65;white-space:pre-wrap;margin-top:8px">${esc(inn.samlet)}</div></div>`+
    Object.entries(inn.perTilbyder||{}).map(([n,t])=>`<div class="card" style="margin-bottom:12px"><b>${esc(n)}</b><div style="font-size:13.5px;line-height:1.6;white-space:pre-wrap;margin-top:8px">${esc(t)}</div></div>`).join("");
}
async function lagInnstilling(){
  if(!state.offers.length)return alert("Last opp tilbud først.");
  const rows=totals();busy("AI skriver innstilling…");
  try{
    const opps=rows.map((o,i)=>`${i+1}. ${o.company||o.name}: ${fmt(o.priceEks)} eks.mva, total ${o.total}. ${o.ai?.sammendrag||""}`).join("\n");
    const fb=state.forbeholdMatrix?.oppsummering?`\nForbehold: ${state.forbeholdMatrix.oppsummering}`:"";
    const samlet=await ai(`Skriv en utfyllende, profesjonell innstilling til byggherre om valg av entreprenør. Norsk, hele avsnitt, konkluder tydelig.\n\nRANGERING:\n${opps}${fb}\n\n3-5 avsnitt, ren tekst.`,1000);
    const perTilbyder={};
    for(const o of rows){busy("Skriver: "+(o.company||o.name)+"…");const vedl=state.vedlegg.filter(v=>v.koblet===(o.company||o.name)).map(v=>v.name).join(", ");
      try{perTilbyder[o.company||o.name]=await ai(`Skriv utfyllende vurdering (norsk, hele avsnitt) av "${o.company||o.name}". Pris ${fmt(o.priceEks)} eks.mva. Score oppdrag ${o.scores?.oppdrag??"-"}, kompetanse ${o.scores?.kompetanse??"-"}, fremdrift ${o.scores?.fremdrift??"-"}, forbehold ${o.scores?.forbehold??"-"}, total ${o.total}. Sammendrag: ${o.ai?.sammendrag||""}. Styrker: ${(o.ai?.styrker||[]).join("; ")}. Svakheter: ${(o.ai?.svakheter||[]).join("; ")}.${vedl?` Vedlegg: ${vedl}.`:""}\n\n2-3 avsnitt, ren tekst.`,1000);}catch(e){perTilbyder[o.company||o.name]="(feil: "+e.message+")";}}
    state.innstilling={samlet,perTilbyder};
  }catch(e){state.innstilling={error:e.message};}
  busy("");await lagre();render();
}

async function exportXlsx(){
  const rows=totals();
  const head=["Rang","Tilbyder","Oppgitt sum","Mva","Sum eks.mva",...CRITERIA.map(c=>c.label),"Total","Sammendrag","Begrunnelse","Avvik"];
  const data=[head];rows.forEach((o,i)=>data.push([i+1,o.company||o.name,o.price||"",o.mva,o.priceEks||"",...CRITERIA.map(c=>o.s[c.key]??""),o.total,o.ai?.sammendrag||"",o.ai?.begrunnelse||"",(o.ai?.avvik||[]).join("; ")]));
  const wb=XLSX.utils.book_new();const ws=XLSX.utils.aoa_to_sheet(data);ws["!cols"]=[{wch:5},{wch:26},{wch:14},{wch:8},{wch:14},...CRITERIA.map(()=>({wch:14})),{wch:9},{wch:44},{wch:50},{wch:36}];XLSX.utils.book_append_sheet(wb,ws,"Evaluering");
  if(state.postMatrix?.grupper?.length){const tb=state.postMatrix.tilbydere;const p=[["NS3451","Bygningsdel","Post",...tb,"Kommentar","Konklusjon"]];state.postMatrix.grupper.forEach(g=>p.push([g.ns3451||"",g.bygningsdel||"",g.beskrivelse||"",...tb.map(t=>g.priser?.[t]??""),g.kommentar||"",g.konklusjon||""]));const w2=XLSX.utils.aoa_to_sheet(p);XLSX.utils.book_append_sheet(wb,w2,"Poster");}
  if(state.forbeholdMatrix?.forbehold?.length){const tb=state.forbeholdMatrix.tilbydere;const fb=[["Tema",...tb,"Vurdering"]];state.forbeholdMatrix.forbehold.forEach(f=>fb.push([f.tema,...tb.map(t=>f.perTilbyder?.[t]||""),f.vurdering||""]));const w3=XLSX.utils.aoa_to_sheet(fb);XLSX.utils.book_append_sheet(wb,w3,"Forbehold");}
  if(state.innstilling&&!state.innstilling.error){const inn=[["Samlet innstilling"],[state.innstilling.samlet||""],[]];Object.entries(state.innstilling.perTilbyder||{}).forEach(([n,t])=>{inn.push([n]);inn.push([t]);inn.push([]);});const w4=XLSX.utils.aoa_to_sheet(inn);w4["!cols"]=[{wch:120}];XLSX.utils.book_append_sheet(wb,w4,"Innstilling");}
  XLSX.writeFile(wb,(state.prosjektNavn||"Tilbudsevaluering")+".xlsx");
}

render();
</script>
